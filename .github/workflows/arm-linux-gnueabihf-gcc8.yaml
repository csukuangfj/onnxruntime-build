name: arm-linux-gnueabihf-gcc8

on:
  push:
    branches:
      - release-v1.31.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.31.0)"
        required: true

permissions:
  contents: write

env:
  ONNXRUNTIME_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch. Appropriate version if not specified
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.31.0' }}

jobs:
  arm_linux_gnueabihf_gcc8:
    name: Build onnxruntime lib for arm32 on ${{ matrix.os }} cxx11-abi-${{ matrix.cxx11_abi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        cxx11_abi: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build result for ${{ env.ONNXRUNTIME_VERSION }}
        id: cache-build-result
        uses: actions/cache@v4
        with:
          path: onnxruntime-linux-arm-${{ env.ONNXRUNTIME_VERSION }}${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}
          key: onnxruntime-arm-linux-${{ env.ONNXRUNTIME_VERSION }}-cache-v1${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}

      - name: ccache
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-armv7

      - name: Update ONNX Runtime
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        run: |
          echo $ONNXRUNTIME_VERSION > ONNXRUNTIME_VERSION
          git submodule update --init --depth=1 onnxruntime
          cd onnxruntime
          git fetch origin tag v$ONNXRUNTIME_VERSION
          git checkout v$ONNXRUNTIME_VERSION

      - name: cache-toolchain
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: toolchain
          key: gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -SL -O https://developer.arm.com/-/media/Files/downloads/gnu-a/8.3-2019.03/binrel/gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf.tar.xz

          mkdir $GITHUB_WORKSPACE/toolchain

          tar xvf ./gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf.tar.xz --strip-components 1 -C $GITHUB_WORKSPACE/toolchain
          rm -v gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf.tar.xz

      - name: Download protoc
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # see ./cmake/deps.txt
          if [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.1[0-3].[0-9] ]]; then
            wget https://github.com/protocolbuffers/protobuf/releases/download/v3.18.1/protoc-3.18.1-linux-x86_64.zip
            unzip protoc-3.18.1-linux-x86_64.zip
          elif [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.14.[0-9] ]]; then
            wget https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-x86_64.zip
            unzip protoc-3.20.3-linux-x86_64.zip
          elif [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.1[56789].[0-9] || ${{ env.ONNXRUNTIME_VERSION }} =~ 1.2[0-9].[0-9] ]]; then
            wget https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
            unzip protoc-21.12-linux-x86_64.zip
          elif [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.[3-9][0-9].[0-9] ]]; then
            wget https://github.com/protocolbuffers/protobuf/releases/download/v33.6/protoc-33.6-linux-x86_64.zip
            unzip protoc-33.6-linux-x86_64.zip
          else
            echo "Unsupported version ${{ env.ONNXRUNTIME_VERSION }}"
            exit 1
          fi
          rm -fv protoc*.zip

          ./bin/protoc --version

      - name: Set environment variable
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/toolchain/bin"  >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/bin"  >> "$GITHUB_PATH"
          ls -lh "$GITHUB_WORKSPACE/toolchain/bin"

          echo "CC=arm-none-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "CXX=arm-none-linux-gnueabihf-g++" >> "$GITHUB_ENV"

      - name: Display toolchain info
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          arm-none-linux-gnueabihf-gcc --version

      - name: Display protoc info for ${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          protoc --version

      - name: Show current directory
        shell: bash
        run: |
          ls -lh
          echo $PWD

      - name: Install dependencies
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install python3 git-lfs
          python3 -m pip install "cmake<4"
          cmake --version

      - name: Build onnxruntime for 32-bit ARM
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --version
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

          export CXX11_ABI=${{ matrix.cxx11_abi }}
          export CMAKE_OPTIONS="-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/arm-linux-gnueabihf.toolchain.cmake -Donnxruntime_CROSS_COMPILING=ON --compile-no-warning-as-error -Donnxruntime_BUILD_UNIT_TESTS=OFF -DONNX_CUSTOM_PROTOC_EXECUTABLE=$GITHUB_WORKSPACE/bin/protoc"
          export SKIP_TEST=1
          ./build-static_lib.sh

      - name: Collect result
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ls -lh output/static_lib/
          ls -lh output/static_lib/include
          ls -lh output/static_lib/lib

          dst=onnxruntime-linux-arm-static_lib-${ONNXRUNTIME_VERSION}${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}
          mkdir $dst
          mv -v output/static_lib/* $dst

          zip -r ${dst}.zip $dst/

      - name: Check _GLIBCXX_USE_CXX11_ABI before upload
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          abi=${{ matrix.cxx11_abi }}

          # Locate the artifact "Collect result" just produced (exactly one expected).
          mapfile -t dirs < <(find . -maxdepth 1 -type d -name 'onnxruntime-*-static_lib*' | sort)
          if [ "${#dirs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one artifact directory, found ${#dirs[@]}"
            printf '%s\n' "${dirs[@]}"
            exit 1
          fi
          dir=${dirs[0]#./}

          # The name must carry the -cxx11-abi marker if and only if the build
          # is the C++11 ABI.
          case "$dir" in
            *-cxx11-abi) name_abi=1 ;;
            *)             name_abi=0 ;;
          esac
          if [ "$name_abi" != "$abi" ]; then
            echo "::error::artifact name '$dir' does not agree with CXX11_ABI=$abi"
            exit 1
          fi

          lib=$(find "$dir" -name 'libonnxruntime.a' | head -1)
          if [ -z "$lib" ]; then
            echo "::error::libonnxruntime.a not found inside $dir"
            exit 1
          fi

          # The two ABIs mangle std::string differently: the C++11 ABI references
          # std::__cxx11::basic_string, the old gcc4-compatible one the COW
          # std::basic_string (mangled with 'Ss').
          undef=$(nm --undefined-only "$lib" | awk '{print $NF}' | sort -u)
          new_abi=$(printf '%s\n' "$undef" | grep -c '__cxx11' || true)
          old_abi=$(printf '%s\n' "$undef" | grep -cE '^_ZNSs|^_ZNSb' || true)

          echo "artifact          : $dir"
          echo "library           : $lib"
          echo "requested         : _GLIBCXX_USE_CXX11_ABI=$abi"
          echo "std::__cxx11 refs : $new_abi"
          echo "old COW str refs  : $old_abi"

          if [ "$abi" = "1" ] && [ "$new_abi" -eq 0 ]; then
            echo "::error::CXX11_ABI=1 was requested but the archive has no std::__cxx11 references. The toolchain overrode the ABI (Red Hat SCL devtoolset defaults to 0). Refusing to upload."
            exit 1
          fi
          if [ "$abi" = "0" ] && [ "$old_abi" -eq 0 ]; then
            echo "::error::CXX11_ABI=0 was requested but the archive has no old-COW std::string references. Refusing to upload."
            exit 1
          fi

          echo "OK: $dir is _GLIBCXX_USE_CXX11_ABI=$abi"

      - name: Upload v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./*.zip"
          overwrite: true
          repo_name: csukuangfj/onnxruntime-libs
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: v${{ env.ONNXRUNTIME_VERSION }}

      - name: Publish to huggingface
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v2
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            rm -rf huggingface
            export GIT_LFS_SKIP_SMUDGE=1
            export GIT_CLONE_PROTECTION_ACTIVE=false

            ls -lh

            git clone https://huggingface.co/csukuangfj2/onnxruntime-libs huggingface
            cd huggingface
            git pull

            name=onnxruntime-linux-arm-static_lib-${ONNXRUNTIME_VERSION}${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}.zip

            version=${{ env.ONNXRUNTIME_VERSION }}
            mkdir -p $version

            ls -lh ../$name


            cp -v ../$name ./$version

            git status
            git add .
            git commit -m "add $name"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs main

      - uses: actions/upload-artifact@v4
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        with:
          name: onnxruntime-linux-arm-static_lib-${{ env.ONNXRUNTIME_VERSION }}${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}
          path: onnxruntime-linux-arm-static_lib*
