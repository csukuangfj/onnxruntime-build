name: aarch64-glibc228

on:
  push:
    branches:
      - release-v1.31.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.31.0)"
        required: true

permissions:
  contents: write

env:
  ONNXRUNTIME_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch. Appropriate version if not specified
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.31.0' }}

jobs:
  aarch64-glibc228:
    name: ${{ matrix.os }} cxx11-abi-${{ matrix.cxx11_abi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm]
        cxx11_abi: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build result for ${{ env.ONNXRUNTIME_VERSION }}
        id: cache-build-result
        uses: actions/cache@v4
        with:
          path: onnxruntime-linux-aarch64-static_lib-${{ env.ONNXRUNTIME_VERSION }}-glibc2_28${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}
          key: onnxruntime-linux-aarch64-static_lib-${{ env.ONNXRUNTIME_VERSION }}-glibc2_28${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}

      - name: Update ONNX Runtime
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        run: |
          echo $ONNXRUNTIME_VERSION > ONNXRUNTIME_VERSION
          git submodule update --init --depth=1 onnxruntime
          cd onnxruntime
          git fetch origin tag v$ONNXRUNTIME_VERSION
          git checkout v$ONNXRUNTIME_VERSION

      - name: Build onnxruntime ${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: addnab/docker-run-action@v3
        with:
            image: quay.io/pypa/manylinux_2_28_aarch64 # onnxruntime v1.22.0 requires gcc >= 11
            # image: quay.io/pypa/manylinux2014_aarch64 # it has only gcc 10. gcc 11 cannot be installed on it
            options: |
              --volume ${{ github.workspace }}/:/shared/
            shell: bash
            run: |
              uname -a
              gcc --version

              echo 'which gcc'
              which gcc

              echo 'gcc --version'
              gcc --version


              # find /opt -name "python*"

              PYBIN_DIR=$(find /opt/_internal -type d -path '*/cpython-3.10.*/bin' -print -quit)
              echo "PYBIN_DIR: $PYBIN_DIR"

              export PATH=$PYBIN_DIR:$PATH

              python3 --version
              python3 -m pip install ninja cmake

              export PATH=/shared/toolchain/bin:$PATH

              cmake --version

              cd /shared
              echo "----------"
              ls -lh
              echo "----------"

              export CXX11_ABI=${{ matrix.cxx11_abi }}
              export CMAKE_OPTIONS="--compile-no-warning-as-error -Donnxruntime_BUILD_UNIT_TESTS=OFF"
              export PARALLEL_JOB_COUNT=1

              git config --global --add safe.directory /shared/onnxruntime
              git config --global --add safe.directory /shared

              ./build-static_lib.sh

              build_dir=output
              chmod a=rwx $build_dir
              ls -lh $build_dir
              ls -lh $build_dir/*
              mv $build_dir/static_lib/lib64 $build_dir/static_lib/lib

              ls -lh $build_dir/static_lib

      - name: Collect result
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ls -lh output/static_lib/
          ls -lh output/static_lib/include
          ls -lh output/static_lib/lib

          dst=onnxruntime-linux-aarch64-static_lib-${ONNXRUNTIME_VERSION}-glibc2_28${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}
          mkdir $dst
          cp -av output/static_lib/* $dst

          zip -r ${dst}.zip $dst/

      - name: Check _GLIBCXX_USE_CXX11_ABI before upload
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          abi=${{ matrix.cxx11_abi }}

          # Locate the artifact "Collect result" just produced (exactly one expected).
          mapfile -t dirs < <(find . -maxdepth 1 -type d -name 'onnxruntime-*-static_lib*' | sort)
          if [ "${#dirs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one artifact directory, found ${#dirs[@]}"
            printf '%s\n' "${dirs[@]}"
            exit 1
          fi
          dir=${dirs[0]#./}

          # The name must carry the -cxx11-abi marker if and only if the build
          # is the C++11 ABI.
          case "$dir" in
            *-cxx11-abi) name_abi=1 ;;
            *)             name_abi=0 ;;
          esac
          if [ "$name_abi" != "$abi" ]; then
            echo "::error::artifact name '$dir' does not agree with CXX11_ABI=$abi"
            exit 1
          fi

          lib=$(find "$dir" -name 'libonnxruntime.a' | head -1)
          if [ -z "$lib" ]; then
            echo "::error::libonnxruntime.a not found inside $dir"
            exit 1
          fi

          # The two ABIs mangle std::string differently: the C++11 ABI references
          # std::__cxx11::basic_string, the old gcc4-compatible one the COW
          # std::basic_string (mangled with 'Ss').
          undef=$(nm --undefined-only "$lib" | awk '{print $NF}' | sort -u)
          new_abi=$(printf '%s\n' "$undef" | grep -c '__cxx11' || true)
          old_abi=$(printf '%s\n' "$undef" | grep -cE '^_ZNSs|^_ZNSb' || true)

          echo "artifact          : $dir"
          echo "library           : $lib"
          echo "requested         : _GLIBCXX_USE_CXX11_ABI=$abi"
          echo "std::__cxx11 refs : $new_abi"
          echo "old COW str refs  : $old_abi"

          if [ "$abi" = "1" ] && [ "$new_abi" -eq 0 ]; then
            echo "::error::CXX11_ABI=1 was requested but the archive has no std::__cxx11 references. The toolchain overrode the ABI (Red Hat SCL devtoolset defaults to 0). Refusing to upload."
            exit 1
          fi
          if [ "$abi" = "0" ] && [ "$old_abi" -eq 0 ]; then
            echo "::error::CXX11_ABI=0 was requested but the archive has no old-COW std::string references. Refusing to upload."
            exit 1
          fi

          echo "OK: $dir is _GLIBCXX_USE_CXX11_ABI=$abi"

      - name: Upload v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./*.zip"
          overwrite: true
          repo_name: csukuangfj/onnxruntime-libs
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: v${{ env.ONNXRUNTIME_VERSION }}

      - name: Publish to huggingface
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v2
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            rm -rf huggingface
            export GIT_LFS_SKIP_SMUDGE=1
            export GIT_CLONE_PROTECTION_ACTIVE=false

            version=${{ env.ONNXRUNTIME_VERSION }}

            ls -lh

            rm -rf huggingface
            git clone https://huggingface.co/csukuangfj2/onnxruntime-libs huggingface
            cd huggingface
            git pull

            name=onnxruntime-linux-aarch64-static_lib-${ONNXRUNTIME_VERSION}-glibc2_28${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}.zip

            mkdir -p $version

            cp -v ../$name $version/

            git status
            git add .
            git commit -m "add $name"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs main

      - uses: actions/upload-artifact@v4
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        with:
          name: onnxruntime-linux-aarch64-static_lib-${{ env.ONNXRUNTIME_VERSION }}-glibc2_28${{ matrix.cxx11_abi == 1 && '-cxx11-abi' || '' }}
          path: onnxruntime-linux-aarch64-static_lib*
