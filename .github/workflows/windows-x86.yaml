name: windows-x86

# eaglecloud-sec fork: see windows-x64.yaml header for rationale.
# scanlib-rs's 32-bit slim launcher does not link ORT statically, but the
# legacy "fallback bundle" cdylib (built with `scanlib-core/ocr-static`)
# does — and that path is what soak runs catch when launcher/worker IPC
# fails. So we keep parity between x64 and x86 mimalloc builds.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.20.1)"
        required: true

permissions:
  contents: write

env:
  ONNXRUNTIME_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch. Appropriate version if not specified
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.20.1' }}

jobs:
  windows_x86:
    name: ${{ matrix.build_type }} static CRT ${{ matrix.use_static_crt }} mimalloc
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # scanlib-rs only consumes MT + Release for x86. See header.
        os: [windows-2022]
        python-version: ["3.10"]
        build_type: ["Release"]
        use_static_crt: ["ON"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache build result for ${{ env.ONNXRUNTIME_VERSION }}
        id: cache-build-result
        uses: actions/cache@v4
        with:
          path: onnxruntime-win-x86-static_lib-static-CRT-${{ matrix.use_static_crt }}-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          key: onnxruntime-win-x86-static-CRT-${{ matrix.use_static_crt }}-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}-cache-v1

      - name: ccache
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-x86

      - name: Update ONNX Runtime
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo ${{ env.ONNXRUNTIME_VERSION }} > ONNXRUNTIME_VERSION
          git submodule update --init --depth=1 onnxruntime
          cd onnxruntime
          git fetch origin tag v${{ env.ONNXRUNTIME_VERSION }}
          git checkout v${{ env.ONNXRUNTIME_VERSION }}

          if [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.16.[0-9] ]]; then
            sed -i.bak '13d' onnxruntime/core/platform/windows/stacktrace.cc
            git status
            git diff
          fi

      - name: Download protoc
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # see ./cmake/deps.txt
          if [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.14.[0-9] ]]; then
            curl -SL -o protoc-3.20.3-win64.zip https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-win64.zip
            ls -lh
            unzip protoc-3.20.3-win64.zip
          elif [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.1[56789].[0-9] || ${{ env.ONNXRUNTIME_VERSION }} =~ 1.2[0-9].[0-9] ]]; then
            curl -SL -o protoc-21.12-win64.zip https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-win64.zip
            ls -lh
            unzip protoc-21.12-win64.zip
          else
            echo "Unsupported version ${{ env.ONNXRUNTIME_VERSION }}"
            exit 1
          fi
          rm -fv protoc*.zip

          ./bin/protoc --version

      - name: Set environment variable
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/bin"  >> "$GITHUB_PATH"

      - name: Display protoc info for ${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          protoc --version

      - name: Show current directory
        shell: bash
        run: |
          ls -lh
          echo $PWD

      - name: Install dependencies
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 -m pip install cmake
          cmake --version

      - name: Build onnxruntime for Windows x86
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --version
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CMAKE_BUILD_TYPE=${{ matrix.build_type }}

          # export CMAKE_OPTIONS='-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug> -DONNX_USE_MSVC_STATIC_RUNTIME=ON -Dprotobuf_MSVC_STATIC_RUNTIME=ON -Dgtest_force_shared_crt=OFF -A Win32 -Donnxruntime_BUILD_UNIT_TESTS=OFF -DONNX_CUSTOM_PROTOC_EXECUTABLE=$GITHUB_WORKSPACE/bin/protoc'
          # export CMAKE_OPTIONS='-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug> -DONNX_USE_MSVC_STATIC_RUNTIME=ON -Dprotobuf_MSVC_STATIC_RUNTIME=ON -Dgtest_force_shared_crt=OFF -A Win32 -Donnxruntime_BUILD_UNIT_TESTS=OFF '

          use_static_crt=${{ matrix.use_static_crt }}

          # See windows-x64.yaml for rationale on `-Donnxruntime_USE_MIMALLOC=ON`.
          # cmake_dependent_option's WIN32 gate is satisfied on both x86 and
          # x64; the NOT_CUDA/NOT_OPENVINO gates are also satisfied because
          # csukuangfj's static_lib bundle does not enable either EP.

          if [[ $use_static_crt == ON ]]; then
            export CMAKE_OPTIONS='-DUSE_STATIC_CRT=ON -Dgtest_force_shared_crt=OFF -A Win32 -Donnxruntime_BUILD_UNIT_TESTS=OFF -Donnxruntime_USE_MIMALLOC=ON '
          else
            export CMAKE_OPTIONS='-DUSE_STATIC_CRT=OFF -Dgtest_force_shared_crt=ON -A Win32 -Donnxruntime_BUILD_UNIT_TESTS=OFF -Donnxruntime_USE_MIMALLOC=ON '
          fi

          ./build-static_lib.sh

      - name: Verify mimalloc symbols in onnxruntime.lib
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Acceptance gate; see windows-x64.yaml twin step.
          set -e
          lib=output/static_lib/lib/onnxruntime.lib
          ls -lh "$lib"

          if [ -f build/static_lib/static_libs.txt ]; then
            echo "=== static_libs.txt (merged archives) ==="
            cat build/static_lib/static_libs.txt
            echo "=== mimalloc lines ==="
            grep -i mimalloc build/static_lib/static_libs.txt || {
              echo "FAIL: build/static_lib/static_libs.txt has no mimalloc archive."
              exit 1
            }
          fi

          STRINGS=""
          for cand in \
            "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin/llvm-strings.exe" \
            "/c/Program Files (x86)/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin/llvm-strings.exe" \
            "/c/Program Files/LLVM/bin/llvm-strings.exe" \
            ; do
            if [ -x "$cand" ]; then STRINGS="$cand"; break; fi
          done
          if [ -z "$STRINGS" ] && command -v strings >/dev/null 2>&1; then
            STRINGS=$(command -v strings)
          fi

          if [ -n "$STRINGS" ]; then
            echo "=== mimalloc strings in onnxruntime.lib (top 20) ==="
            "$STRINGS" "$lib" | grep -iE "mimalloc|mi_(malloc|free|heap|init|os_alloc)" | sort -u | head -20 || true
            count=$("$STRINGS" "$lib" | grep -ciE "mimalloc|mi_(malloc|free|heap|init|os_alloc)" || echo 0)
            echo "Total mimalloc-related symbol matches: $count"
            if [ "$count" -lt 5 ]; then
              echo "FAIL: expected mimalloc symbols in bundled onnxruntime.lib but found only $count matches."
              exit 1
            fi
          else
            echo "WARN: no `strings` tool available; skipping symbol grep."
          fi

      - name: Collect result
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ls -lh output/static_lib/
          ls -lh output/static_lib/include
          ls -lh output/static_lib/lib

          use_static_crt=${{ matrix.use_static_crt }}
          if [[ $use_static_crt == ON ]]; then
            dst=onnxruntime-win-x86-static_lib-MT-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          else
            dst=onnxruntime-win-x86-static_lib-MD-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          fi

          mkdir $dst
          mv -v output/static_lib/* $dst

      - name: zip results
        shell: bash
        run: |
          ls -lh

          use_static_crt=${{ matrix.use_static_crt }}
          if [[ $use_static_crt == ON ]]; then
            dst=onnxruntime-win-x86-static_lib-MT-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          else
            dst=onnxruntime-win-x86-static_lib-MD-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          fi

          tar cjvf $dst.tar.bz2 $dst
          ls -lh

          # Produce an aliased tarball matching the upstream csukuangfj
          # naming `onnxruntime-win-x86-static_lib-<version>.tar.bz2` so
          # the existing scanlib-rs download steps work unchanged once
          # pointed at this fork's release. See windows-x64.yaml.
          short=onnxruntime-win-x86-static_lib-${{ env.ONNXRUNTIME_VERSION }}
          if [[ $use_static_crt == ON && "${{ matrix.build_type }}" == "Release" ]]; then
            rm -rf "$short"
            cp -R "$dst" "$short"
            tar cjvf "$short.tar.bz2" "$short"
            ls -lh "$short.tar.bz2"
          fi

      # Upstream csukuangfj/onnxruntime-libs upload + HuggingFace mirror
      # steps removed (no PAT, no HF token); fork uploads to its own
      # releases via GITHUB_TOKEN below.

      - uses: actions/upload-artifact@v4
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        with:
          name: onnxruntime-win-x86-static_lib-static-CRT-${{ matrix.use_static_crt }}-${{ matrix.build_type }}-mimalloc
          path: onnxruntime-win-x86-static_lib*.tar.bz2

      - name: Upload to fork release v${{ env.ONNXRUNTIME_VERSION }}-mimalloc
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./onnxruntime-win-x86-static_lib*.tar.bz2"
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.ONNXRUNTIME_VERSION }}-mimalloc
          body: |
            ORT static-lib builds with `onnxruntime_USE_MIMALLOC=ON`.
            See workflow `.github/workflows/windows-x86.yaml` and
            scanlib-rs followup#76 for the rationale.
