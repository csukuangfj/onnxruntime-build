name: windows-x64

# eaglecloud-sec fork: builds Microsoft ONNX Runtime as a single static
# `onnxruntime.lib` archive with `--use_mimalloc` enabled so that the
# ORT C++ allocator (CPUAllocator + new/delete shim) routes through
# mimalloc instead of NT-Heap. Consumed by scanlib-rs (followup#76 P2).
#
# Differences vs upstream csukuangfj/onnxruntime-build:
# - CMAKE_OPTIONS adds `-Donnxruntime_USE_MIMALLOC=ON`
# - matrix trimmed to MT + Release (the only combo scanlib-rs consumes)
# - HuggingFace mirror step disabled (we don't hold csukuangfj2's HF_TOKEN)
# - svenstaro/upload-release-action retargets the fork's own
#   `eaglecloud-sec/onnxruntime-libs` mirror repo (GITHUB_TOKEN is enough
#   when the workflow itself can write to that repo via a fork-scoped PAT
#   stored as `secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN`). If that secret is
#   absent we fall back to actions/upload-artifact and `gh run download`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.20.1)"
        required: true

permissions:
  contents: write

env:
  ONNXRUNTIME_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch. Appropriate version if not specified
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.20.1' }}

jobs:
  windows_x64:
    name: ${{ matrix.os }} ${{ matrix.build_type }} static CRT ${{ matrix.use_static_crt }} mimalloc
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # scanlib-rs only consumes MT + Release. Drop the other 7 combos to
        # save ~6 hours of windows-2022 minutes per build.
        os: [windows-2022]
        python-version: ["3.10"]
        build_type: ["Release"]
        use_static_crt: ["ON"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache build result for ${{ env.ONNXRUNTIME_VERSION }}
        id: cache-build-result
        uses: actions/cache@v4
        with:
          path: onnxruntime-win-x64-static_lib-static-crt-${{ matrix.use_static_crt }}-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          key: onnxruntime-win-x64-static-crt-${{ matrix.use_static_crt }}-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}-cache-v1

      - name: ccache
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-x64-${{ matrix.build_type }}

      - name: Update ONNX Runtime
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo ${{ env.ONNXRUNTIME_VERSION }} > ONNXRUNTIME_VERSION
          git submodule update --init --depth=1 onnxruntime
          cd onnxruntime
          git fetch origin tag v${{ env.ONNXRUNTIME_VERSION }}
          git checkout v${{ env.ONNXRUNTIME_VERSION }}

          if [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.16.[0-9] ]]; then
            sed -i.bak '13d' onnxruntime/core/platform/windows/stacktrace.cc
            git status
            git diff
          fi

          # Note: the v1.20.1 eigen → eigen-mirror swap is applied
          # inside `build-static_lib.sh` (after the script's own
          # submodule re-sync) so a downstream rebuild doesn't see the
          # patch get clobbered by `git submodule update --recursive`.

      - name: Download protoc
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # see ./cmake/deps.txt
          if [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.14.[0-9] ]]; then
            curl -SL -o protoc-3.20.3-win64.zip https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-win64.zip
            ls -lh
            file protoc-3.20.3-win64.zip
            unzip protoc-3.20.3-win64.zip
          elif [[ ${{ env.ONNXRUNTIME_VERSION }} =~ 1.1[56789].[0-9] || ${{ env.ONNXRUNTIME_VERSION }} =~ 1.2[0-9].[0-9] ]]; then
            curl -SL -o protoc-21.12-win64.zip https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-win64.zip
            ls -lh
            file protoc-21.12-win64.zip
            unzip protoc-21.12-win64.zip
          else
            echo "Unsupported version ${{ env.ONNXRUNTIME_VERSION }}"
            exit 1
          fi
          rm -fv protoc*.zip

          ./bin/protoc --version

      - name: Set environment variable
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/bin"  >> "$GITHUB_PATH"

      - name: Display protoc info for ${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          protoc --version

      - name: Show current directory
        shell: bash
        run: |
          ls -lh
          echo $PWD

      - name: Install dependencies
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 -m pip install cmake
          cmake --version

      - name: Build onnxruntime for Windows x64
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --version
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

          export CMAKE_BUILD_TYPE=${{ matrix.build_type }}

          # export CMAKE_OPTIONS='-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug> -DONNX_USE_MSVC_STATIC_RUNTIME=ON -Dprotobuf_MSVC_STATIC_RUNTIME=ON -Dgtest_force_shared_crt=OFF -A x64 -Donnxruntime_BUILD_UNIT_TESTS=OFF -DONNX_CUSTOM_PROTOC_EXECUTABLE=$GITHUB_WORKSPACE/bin/protoc'
          # export CMAKE_OPTIONS='-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug> -DONNX_USE_MSVC_STATIC_RUNTIME=ON -Dprotobuf_MSVC_STATIC_RUNTIME=ON -Dgtest_force_shared_crt=OFF -A x64 -Donnxruntime_BUILD_UNIT_TESTS=OFF '

          use_static_crt=${{ matrix.use_static_crt }}

          # `-Donnxruntime_USE_MIMALLOC=ON` flips the
          # `cmake_dependent_option(onnxruntime_USE_MIMALLOC ... OFF
          #  "WIN32;NOT onnxruntime_USE_CUDA;NOT onnxruntime_USE_OPENVINO" OFF)`
          # in microsoft/onnxruntime cmake/CMakeLists.txt:141 (v1.20.1).
          # That option in cmake/onnxruntime_common.cmake:104-108 creates
          # `onnxruntime_mimalloc_shim` (PRIVATE-linking `mimalloc-static`)
          # and links it PRIVATE into `onnxruntime_common`, so
          # bundle_static_library.cmake transitively picks up
          # `mimalloc-static.lib` and merges its objects into the final
          # single `onnxruntime.lib`.

          if [[ $use_static_crt == ON ]]; then
            export CMAKE_OPTIONS='-DUSE_STATIC_CRT=ON -Dgtest_force_shared_crt=OFF -A x64 -Donnxruntime_BUILD_UNIT_TESTS=OFF -Donnxruntime_USE_MIMALLOC=ON '
          else
            export CMAKE_OPTIONS='-DUSE_STATIC_CRT=OFF -Dgtest_force_shared_crt=ON -A x64 -Donnxruntime_BUILD_UNIT_TESTS=OFF -Donnxruntime_USE_MIMALLOC=ON '
          fi

          echo "CMAKE_OPTIONS: $CMAKE_OPTIONS"

          ./build-static_lib.sh

      - name: Verify mimalloc symbols in onnxruntime.lib
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Acceptance gate: the bundled `onnxruntime.lib` MUST contain
          # mimalloc objects. If `-Donnxruntime_USE_MIMALLOC=ON` did not
          # take effect (e.g. cmake_dependent_option clamped to OFF
          # because of an unexpected `onnxruntime_USE_CUDA=ON` cascade),
          # the lib will be silently identical to the upstream build.
          set -e
          lib=output/static_lib/lib/onnxruntime.lib
          ls -lh "$lib"

          # static_libs.txt is generated by bundle_static_library.cmake
          # and lists every .lib that lib.exe merged into the bundle.
          if [ -f build/static_lib/static_libs.txt ]; then
            echo "=== static_libs.txt (merged archives) ==="
            cat build/static_lib/static_libs.txt
            echo "=== mimalloc lines ==="
            grep -i mimalloc build/static_lib/static_libs.txt || {
              echo "FAIL: build/static_lib/static_libs.txt has no mimalloc archive."
              echo "      onnxruntime_USE_MIMALLOC likely did not propagate."
              exit 1
            }
          fi

          # Use llvm-strings via Visual Studio LLVM toolchain.
          STRINGS=""
          for cand in \
            "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin/llvm-strings.exe" \
            "/c/Program Files (x86)/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin/llvm-strings.exe" \
            "/c/Program Files/LLVM/bin/llvm-strings.exe" \
            ; do
            if [ -x "$cand" ]; then STRINGS="$cand"; break; fi
          done
          if [ -z "$STRINGS" ] && command -v strings >/dev/null 2>&1; then
            STRINGS=$(command -v strings)
          fi

          if [ -n "$STRINGS" ]; then
            echo "=== mimalloc strings in onnxruntime.lib (top 20) ==="
            "$STRINGS" "$lib" | grep -iE "mimalloc|mi_(malloc|free|heap|init|os_alloc)" | sort -u | head -20 || true
            count=$("$STRINGS" "$lib" | grep -ciE "mimalloc|mi_(malloc|free|heap|init|os_alloc)" || echo 0)
            echo "Total mimalloc-related symbol matches: $count"
            if [ "$count" -lt 5 ]; then
              echo "FAIL: expected mimalloc symbols in bundled onnxruntime.lib but found only $count matches."
              exit 1
            fi
          else
            echo "WARN: no `strings` tool available; skipping symbol grep."
          fi

      - name: Collect result
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ls -lh output/static_lib/
          ls -lh output/static_lib/include
          ls -lh output/static_lib/lib

          use_static_crt=${{ matrix.use_static_crt }}

          if [[ $use_static_crt == ON ]]; then
            dst=onnxruntime-win-x64-static_lib-MT-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          else
            dst=onnxruntime-win-x64-static_lib-MD-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          fi

          mkdir $dst
          mv -v output/static_lib/* $dst

      - name: zip results
        shell: bash
        run: |
          use_static_crt=${{ matrix.use_static_crt }}

          if [[ $use_static_crt == ON ]]; then
            dst=onnxruntime-win-x64-static_lib-MT-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          else
            dst=onnxruntime-win-x64-static_lib-MD-${{ matrix.build_type }}-${{ env.ONNXRUNTIME_VERSION }}
          fi

          tar cjvf $dst.tar.bz2 $dst
          ls -lh

          # Also produce a copy matching scanlib-rs's expected naming
          # convention, with `-mimalloc` suffix so the cache key on the
          # downstream side invalidates cleanly on the switch from the
          # non-mimalloc upstream csukuangfj tarball.
          #
          # File layout:
          #   onnxruntime-win-x64-static_lib-1.20.1-mimalloc.tar.bz2
          #     └── onnxruntime-win-x64-static_lib-1.20.1-mimalloc/
          #           ├── include/  (ORT C/C++ headers)
          #           └── lib/onnxruntime.lib  (273M MT-Release single archive)
          mimalloc=onnxruntime-win-x64-static_lib-${{ env.ONNXRUNTIME_VERSION }}-mimalloc
          if [[ $use_static_crt == ON && "${{ matrix.build_type }}" == "Release" ]]; then
            rm -rf "$mimalloc"
            cp -R "$dst" "$mimalloc"
            tar cjvf "$mimalloc.tar.bz2" "$mimalloc"
            ls -lh "$mimalloc.tar.bz2"
          fi

      # Upstream uploads to csukuangfj/onnxruntime-libs releases via a
      # PAT we don't hold. Replaced with `actions/upload-artifact` below
      # (already present) so that downstream `scanlib-rs` can fetch the
      # tarball via `gh run download` or via a follow-up release-asset
      # upload triggered out-of-band once the artifact is verified.

      # Upstream HF mirror step removed: we don't hold csukuangfj2's
      # HF_TOKEN and the fork doesn't need a HuggingFace mirror — the
      # GitHub artifact + (optional) release asset is the only consumer.

      - uses: actions/upload-artifact@v4
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        with:
          name: onnxruntime-win-x64-static_lib-static-CRT-${{ matrix.use_static_crt }}-${{ matrix.build_type }}-mimalloc
          path: onnxruntime-win-x64-static_lib*.tar.bz2

      # Upload to this fork's own releases under tag `v<version>-mimalloc`.
      # GITHUB_TOKEN has `contents: write` permission for this repo (see
      # the `permissions:` block at the top), so no external PAT needed.
      - name: Upload to fork release v${{ env.ONNXRUNTIME_VERSION }}-mimalloc
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./onnxruntime-win-x64-static_lib*.tar.bz2"
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.ONNXRUNTIME_VERSION }}-mimalloc
          body: |
            ORT static-lib builds with `onnxruntime_USE_MIMALLOC=ON`.
            See workflow `.github/workflows/windows-x64.yaml` and
            scanlib-rs followup#76 for the rationale.
